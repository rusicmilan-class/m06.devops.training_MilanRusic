version: v1.0
name: Terraform LocalStack Pipeline
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
blocks:
  - name: Init
    dependencies: []
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Run terraform init
          commands:
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
  - name: Deploy
    dependencies:
      - Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Deploy S3 bucket
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
  - name: Use bucket
    dependencies:
      - Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Run AWS
          commands:
            - cd 1-terraform-apply
            - 'aws s3 cp README.md s3://group1-milan/'
            - 'aws s3 ls s3://group1-milan'
            - 'aws s3 rm s3://group1-milan/README.md'
  - name: Destroy
    dependencies:
      - Use bucket
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Destroy the artifact
          commands:
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate --force
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform destroy -auto-approve
  - name: EC2 Deploy
    dependencies:
      - Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Deploy EC2
          commands:
            - cd 2-terraform-ec2
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - terraform validate
            - terraform apply -auto-approve
            - cp terraform.tfstate terraform.tfstate_
            - artifact push workflow terraform.tfstate_
  - name: EC2 Destroy
    dependencies:
      - EC2 Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Delete all
          commands:
            - cd 2-terraform-ec2
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate_ --force
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - mv terraform.tfstate_ terraform.tfstate
            - terraform destroy -auto-approve
  - name: DynamoDB Deploy
    dependencies:
      - Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Deploy DynamoDB
          commands:
            - cd 3-terraform-dynamodb
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - aws dynamodb delete-table --table-name group1-milan-table || true
            - terraform validate
            - terraform apply -auto-approve
            - cp terraform.tfstate terraform.tfstate_3
            - artifact push workflow terraform.tfstate_3
  - name: DynamoDB Interact
    dependencies:
      - DynamoDB Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Interact with the table
          commands:
            - cd 3-terraform-dynamodb
            - aws dynamodb list-tables
            - aws dynamodb describe-table --table-name group1-milan-table
            - 'aws dynamodb put-item --table-name group1-milan-table --item ''{ "user_id": {"S": "u1"}, "name": {"S": "Alice"}, "email": {"S": "alice@example.com"} }'''
            - aws dynamodb scan --table-name group1-milan-table
  - name: DynamoDB Destroy
    dependencies:
      - DynamoDB Interact
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Destroy the 03
          commands:
            - cd 3-terraform-dynamodb
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - artifact pull workflow terraform.tfstate_3 --force
            - chmod +x .terraform/providers/registry.terraform.io/hashicorp/aws/3.76.1/linux_amd64/terraform-provider-aws_v3.76.1_x5
            - mv terraform.tfstate_3 terraform.tfstate
            - terraform destroy -auto-approve
