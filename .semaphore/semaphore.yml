version: v1.0
name: Terraform LocalStack Pipeline
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Terraform init
          commands:
            - checkout
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
  - name: Deploy
    dependencies:
      - Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: 'Validate, plan, apply'
          commands:
            - checkout
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - terraform validate
            - terraform plan
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
            - echo "Done"
