version: v1.0
name: "Terraform LocalStack Pipeline"

agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404

blocks:
  - name: "Init"
    task:
      secrets:
        - name: localstack
      jobs:
        - name: "Terraform init"
          commands:
            - checkout
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl

  