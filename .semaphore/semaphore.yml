version: v1.0
name: Terraform LocalStack Pipeline
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: Init
    task:
      secrets:
        - name: localstack
      jobs:
        - name: Terraform init
          commands:
            - checkout
            - cd 1-terraform-apply
            - terraform init
            - artifact push workflow .terraform
            - artifact push workflow .terraform.lock.hcl
  - name: Deploy
    task:
      secrets:
        - name: localstack
      jobs:
        - name: 'Validate, plan, apply'
          commands:
            - checkout
            - cd 1-terraform-apply
            - artifact pull workflow .terraform
            - artifact pull workflow .terraform.lock.hcl
            - 'find .terraform -type f -name ''terraform-provider-*'' -exec chmod +x {} \;'
            - terraform validate
            - terraform plan
            - terraform apply -auto-approve
            - artifact push workflow terraform.tfstate
  - name: Use bucket
    task:
      secrets:
        - name: localstack
      jobs:
        - name: 'AWS S3 copy, list, remove'
          commands:
            - checkout
            - cd 1-terraform-apply
            - 'BUCKET_NAME="${TF_VAR_bucket_name:-group1-milan}"'
            - '[ -n "${BUCKET_NAME}" ] || { echo "BUCKET_NAME is empty"; exit 1; }'
            - 'ENDPOINT_URL="${TF_VAR_aws_endpoint:-http://devops.tomfern.com:31566}"'
            - 'aws s3 cp README.md "s3://${BUCKET_NAME}/" --endpoint-url "${ENDPOINT_URL}"'
            - 'aws s3 ls "s3://${BUCKET_NAME}" --endpoint-url "${ENDPOINT_URL}"'
            - 'aws s3 rm "s3://${BUCKET_NAME}/README.md" --endpoint-url "${ENDPOINT_URL}"'
